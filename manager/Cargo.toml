[package]
name = "devops-gha-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
async-signal = "0.2.14"
chrono = "0.4.45"
cloneable_errors = "2.3.0"
futures-lite = "2.6.1"
getrandom = "0.4.3"
jsonwebtoken = "10.4.0"
libc = "0.2.190"
octocrab = "0.54.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"
todo = "warn"

[profile.release]
strip = true
lto = "thin"
