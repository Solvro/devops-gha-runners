name: Runner images

on:
  push:
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
    branches-ignore: ["gh-readonly-queue/**"]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch_latest_gha:
    name: Fetch latest actions/runner release
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release
        id: fetch
        run: |
          curl --fail -o release.json https://api.github.com/repos/actions/runner/releases/latest
          jq -r '"version=" + .tag_name' release.json >> "$GITHUB_OUTPUT"
          jq -r '"is_recent=" + (now - (.updated_at | fromdateiso8601) < 24*60*60 | tostring)' release.json >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.fetch.outputs.version }}
      is_recent: ${{ steps.fetch.outputs.is_recent }}
  build_images:
    name: Build runner images
    needs: [fetch_latest_gha]
    if: github.event_name != 'schedule' || needs.fetch_latest_gha.outputs.is_recent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get docker caches
        uses: actions/cache@v6
        id: cache
        with:
          path: cache-mounts
          key: cache-mounts

      - name: Restore docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-dir: cache-mounts
          cache-map: |
            {
              "debian-cache": {
                "target": "/var/cache",
                "id": "debian-cache"
              },
              "debian-apt": {
                "target": "/var/lib/apt",
                "id": "debian-apt"
              },
              "nvm-cache": {
                "target": "/runner/.nvm/.cache",
                "id": "nvm-cache",
                "uid": "1000",
                "gid": "1000"
              },
              "npm-cache": {
                "target": "/runner/.npm",
                "id": "npm-cache",
                "uid": "1000",
                "gid": "1000"
              }
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build images
        env:
          RUNNER_VERSION: ${{ needs.fetch_latest_gha.outputs.version }}
        run: |
          IMAGE_NAME="ghcr.io/solvro/devops-gha-runners"

          # compute the build order for images
          BUILD_ORDER=()

          function queue_image() {
            local TO_ADD BASE_IMAGE IMAGE
            TO_ADD=$1
            # check if we're already in the build queue
            for IMAGE in "${BUILD_ORDER[@]}"
            do
              if [[ "$IMAGE" == "$TO_ADD" ]]
              then
                return
              fi
            done

            # check if we depend on another image
            if BASE_IMAGE="`grep "FROM $IMAGE_NAME" images/$TO_ADD/Dockerfile`"
            then
              BASE_IMAGE="${BASE_IMAGE#*:}"
              BASE_IMAGE="${BASE_IMAGE% *}"
              # make sure it is added before us
              queue_image "$BASE_IMAGE"
            fi

            # add ourselves to the queue
            BUILD_ORDER+=("$TO_ADD")
          }

          ## go over each image and try to add it
          ## queue_image will add all dependencies of that image
          ## but it will also skip adding an image that already exists in the queue
          for IMAGE in images/*
          do
            IMAGE=${IMAGE##*/}
            # make sure the "image" is actually an image
            if [[ ! -d "images/$IMAGE" || ! -f "images/$IMAGE/Dockerfile" ]]
            then
              continue
            fi
            queue_image "$IMAGE"
          done
          echo "Image build order:" "${BUILD_ORDER[@]}"

          # then build all images
          for IMAGE in "${BUILD_ORDER[@]}"
          do
            # builden machen
            echo "::group::Building $IMAGE"
            docker build -t "$IMAGE_NAME:$IMAGE" -t "$IMAGE_NAME:$IMAGE-$RUNNER_VERSION" --build-arg RUNNER_VERSION "images/$IMAGE"
            echo "::endgroup::"
          done

      - name: Publish images
        if: contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$USER" --password-stdin
          docker image push --all-tags ghcr.io/solvro/devops-gha-runners
